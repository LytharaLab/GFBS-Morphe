plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.29'
    id 'com.gradleup.shadow' version '8.3.11'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/'),
                '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenCentral()
}

// LuaJ is intentionally kept as a dedicated shading input. The development
// runtime still sees the original coordinates, while the distributable JAR
// receives a private, relocated copy so other mods cannot supply Morphe's LuaJ.
configurations {
    morpheLua
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    minecraftLibrary 'org.luaj:luaj-jse:3.0.1'
    morpheLua 'org.luaj:luaj-jse:3.0.1'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version: forge_version,
        forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]

    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(Jar).configureEach {
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': mod_authors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Keep the ordinary ForgeGradle JAR visibly marked as unbundled. It exists as
// an intermediate/development artifact only; the no-classifier Shadow JAR is
// the canonical distributable Morphe artifact.
tasks.named('jar', Jar).configure {
    archiveClassifier = 'unbundled'
    finalizedBy 'reobfJar'
}

tasks.named('shadowJar').configure {
    configurations = [project.configurations.morpheLua]
    archiveClassifier = ''

    // Private Morphe LuaJ namespace. This is the actual classloader-conflict fix:
    // Axiom keeps org.luaj.*, Morphe ships org.lytharalab.gfbs.morphe.internal.luaj.*.
    relocate 'org.luaj', 'org.lytharalab.gfbs.morphe.internal.luaj'

    // Dependency signatures are invalid after shading and must not leak into
    // the resulting mod JAR.
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

// Forge 1.20.1 production mappings must be applied to the shaded artifact too.
reobf {
    shadowJar {}
}

tasks.named('shadowJar').configure {
    finalizedBy 'reobfShadowJar'
}

// Fail the build if a future dependency/configuration regression accidentally
// reintroduces the public org.luaj namespace or leaves stale bytecode references.
tasks.register('verifyLuaIsolation') {
    group = 'verification'
    description = 'Verifies that the distributable Morphe JAR contains only the relocated private LuaJ runtime.'
    dependsOn 'reobfShadowJar'

    doLast {
        def artifact = tasks.named('shadowJar').get().archiveFile.get().asFile
        if (!artifact.isFile()) {
            throw new GradleException("Shadow JAR was not produced: ${artifact}")
        }

        def zip = new java.util.zip.ZipFile(artifact)
        try {
            def leakedEntries = []
            def staleReferences = []
            def hasRelocatedLuaValue = false

            zip.entries().each { entry ->
                if (entry.name.startsWith('org/luaj/')) {
                    leakedEntries << entry.name
                }

                if (entry.name == 'org/lytharalab/gfbs/morphe/internal/luaj/vm2/LuaValue.class') {
                    hasRelocatedLuaValue = true
                }

                if (!entry.directory && entry.name.endsWith('.class')) {
                    def raw = new String(zip.getInputStream(entry).bytes, 'ISO-8859-1')
                    if (raw.contains('org/luaj/') || raw.contains('org.luaj.')) {
                        staleReferences << entry.name
                    }
                }
            }

            if (!leakedEntries.isEmpty()) {
                throw new GradleException("LuaJ isolation failed: public org/luaj classes leaked into ${artifact.name}: ${leakedEntries.take(10)}")
            }

            if (!staleReferences.isEmpty()) {
                throw new GradleException("LuaJ isolation failed: stale org.luaj references remain in ${artifact.name}: ${staleReferences.take(10)}")
            }

            if (!hasRelocatedLuaValue) {
                throw new GradleException("LuaJ isolation failed: relocated LuaValue.class is missing from ${artifact.name}")
            }

            logger.lifecycle("Morphe LuaJ isolation verified: ${artifact.name}")
        } finally {
            zip.close()
        }
    }
}

tasks.named('build').configure {
    dependsOn 'verifyLuaIsolation'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

tasks.withType(JavaCompile).configureEach {
    options.warnings = false
    options.compilerArgs += [
            '-Xlint:none',
            '-nowarn'
    ]
}

tasks.register('coreSmoke', JavaExec) {
    group = 'verification'
    description = 'Runs the renderer-independent Morphe core smoke tests.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.lytharalab.gfbs.morphe.core.CoreSmokeTest'
}

tasks.register('luaSmoke', JavaExec) {
    group = 'verification'
    description = 'Starts the real LuaJ sandbox and validates allowed and forbidden libraries.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.lytharalab.gfbs.morphe.script.LuaRuntimeSmokeTest'
}

tasks.named('check').configure {
    dependsOn 'coreSmoke', 'luaSmoke'
}
